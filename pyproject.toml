[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gridrlvr"
version = "0.1.0"
description = "Simulator-verified multi-turn power-grid restoration with verl"
requires-python = ">=3.11"
# Simulator, numerical optimization, and chat-endpoint client dependencies.
dependencies = [
    "gym-anm==2.0.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "cvxpy>=1.4",
    "openai>=1.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Training launcher and Parquet dataset generation.
train = ["verl==0.9.0", "pandas>=2.1", "pyarrow>=15", "PyYAML>=6"]
# Local RestoreBench environment service; HTTP clients use the base install.
restorebench = ["restorebench>=0.1,<0.2", "pandapower==3.4.0", "pydantic>=2"]

[tool.setuptools.packages.find]
include = ["gridrlvr*"]
